[package]
name = "attrouter"
version = "0.1.0"
edition = "2024"
description = "Async Rust client for AT&T residential gateway routers (BGW210, BGW320, Humax, Arris)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/erikh/attrouter"
readme = "../README.md"
keywords = ["att", "bgw320", "router", "gateway", "humax"]
categories = ["api-bindings", "network-programming"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls"] }
scraper = "0.21"
md-5 = "0.10"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
http = "1"
http-body-util = "0.1"
rand = "0.8"
